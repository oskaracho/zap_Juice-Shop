plugins {
    id 'java'
    id 'io.qameta.allure' version '4.3.0'
}

group = 'org.example'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

dependencies {
    testImplementation platform('org.junit:junit-bom:6.0.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    //rest assured
    testImplementation 'io.rest-assured:rest-assured:6.1.0'
    // selenium
    implementation 'org.seleniumhq.selenium:selenium-java:4.51.0'
    // allure
    testImplementation 'io.qameta.allure:allure-jupiter:3.0.0'
}

test {
    useJUnitPlatform()
}
